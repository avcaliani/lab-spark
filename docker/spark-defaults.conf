# ---––––––-----––––––-----––––––-----––––––-–-–-–-–-–-–-
# Default Spark Configuration for Local Execution
# ---––––––-----––––––-----––––––-----––––––-–-–-–-–-
# Any --conf in spark-submit command still overrides it.

# Local Mode, meaning driver = executor
spark.master                               local[*]
spark.driver.memory                        4g

# Default is 200, way too many tiny tasks for ~1M rows on a notebook
spark.sql.shuffle.partitions                8
spark.databricks.delta.snapshotPartitions   8

# Delta Lake
spark.sql.extensions                       io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog            org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.warehouse.dir                    /tmp/spark-warehouse

# History Server (http://localhost:18080)
spark.eventLog.enabled                     true
spark.eventLog.dir                         /data/spark-events
spark.history.fs.logDirectory              /data/spark-events
