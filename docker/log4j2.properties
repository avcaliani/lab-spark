# ---––––––-----––––––-----––––––-----––––––-
# Log4j 2 Config for Local Execution
# ---––––––-----––––––-----––––––-----––––––-

status = warn

rootLogger.level = info
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %style{%d{yyyy/MM/dd HH:mm:ss}}{dim} %highlight{%p}{FATAL=red bold, ERROR=red, WARN=yellow, INFO=green, DEBUG=blue, TRACE=cyan} %style{[%t]}{magenta} %style{%c}{cyan}: %m%n

# Third-party noise
logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.spark_string_utils.name = org.apache.spark.util.SparkStringUtils
logger.spark_string_utils.level = error

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error

logger.hive_retry.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.hive_retry.level = fatal

logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn

logger.parquet.name = org.apache.parquet
logger.parquet.level = warn

logger.delta.name = io.delta
logger.delta.level = warn

# My Custom Apps
logger.kwik_e_chain.name = br.avcaliani.kwikechain
logger.kwik_e_chain.level = debug
