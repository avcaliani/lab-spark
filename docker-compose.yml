services:
  spark:
    build: .
    image: spark-lab
    container_name: spark-lab
    working_dir: /opt/spark-apps
    environment:
      DATA_PATH: /data
    ports:
      - "4040:4040"   # Spark UI (while a job runs)
      - "18080:18080" # Spark History Server
    volumes:
      - ./pocs:/opt/spark-apps/apps
      - ./scripts:/opt/spark-apps/scripts
      - ./scripts/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./data:/data
    # Start the History Server, then stay alive so we can exec into it
    command: bash -c "mkdir -p /data/spark-events && start-history-server.sh && tail -f /dev/null"
